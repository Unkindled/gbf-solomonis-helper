idx+2])/3>200: cnt+=1\n    if cnt>0: print('  x='+str(x)+': '+str(cnt))\n\"", "Bash=cd \"D:\\reasonixWrokspace\\gbf-rouge-helper\" && node -e \"\nconst fs = require('fs');\nconst zlib = require('zlib');\n\nfunction load(path) {\n  const buf = fs.readFileSync(path);\n  let off = 8, idat = Buffer.alloc(0), w, h, ct;\n  while (off < buf.length) {\n    const len = buf.readUInt32BE(off);\n    const typ = buf.toString('ascii', off + 4, off + 8);\n    const data = buf.slice(off + 8, off + 8 + len);\n    if (typ === 'IHDR') { w = data.readUInt32BE(0); h = data.readUInt32BE(4); ct = data[9]; }\n    else if (typ === 'IDAT') idat = Buffer.concat([idat, data]);\n    off += 12 + len;\n  }\n  const raw = zlib.inflateSync(idat);\n  const bpp = ct === 6 ? 4 : ct === 2 ? 3 : ct === 4 ? 2 : 1;\n  const stride = w * bpp;\n  const px = Buffer.alloc(w * h * bpp);\n  for (let y = 0; y < h; y++) {\n    const f = raw[y * (stride + 1)];\n    const rs = y * (stride + 1) + 1;\n    for (let x = 0; x < stride; x++) {\n      const rb = raw[rs + x];\n      const left = x >= bpp ? px[y * stride + x - bpp] : 0;\n      const up = y > 0 ? px[(y - 1) * stride + x] : 0;\n      const ul = (x >= bpp && y > 0) ? px[(y - 1) * stride + x - bpp] : 0;\n      let v;\n      if (f === 0) v = rb;\n      else if (f === 1) v = rb + left;\n      else if (f === 2) v = rb + up;\n      else if (f === 3) v = rb + ((left + up) >> 1);\n      else { const p = left + up - ul; const pa = Math.abs(p-left), pb = Math.abs(p-up), pc = Math.abs(p-ul); v = rb + (pa<=pb&&pa<=pc?left:pb<=pc?up:ul); }\n      px[y * stride + x] = v & 0xff;\n    }\n  }\n  return { w, h, bpp, ct, px };\n}\n\nfunction stats(path) {\n  const { w, h, bpp, ct, px } = load(path);\n  console.log('=== ' + path + '  colorType=' + ct + ' bpp=' + bpp + ' ===');\n  // 采样几个像素\n  const sample = (x, y) => {\n    const i = y * w * bpp + x * bpp;\n    if (bpp === 4) return 'rgba(' + px[i] + ',' + px[i+1] + ',' + px[i+2] + ',' + px[i+3] + ')';\n    if (bpp === 3) return 'rgb(' + px[i] + ',' + px[i+1] + ',' + px[i+2] + ')';\n    return 'g=' + px[i] + ' a=' + px[i+1];\n  };\n  console.log('  center pixel: ' + sample((w>>1), (h>>1)));\n  console.log('  corner(0,0):  ' + sample(0, 0));\n  console.log('  corner(max):  ' + sample(w-1, h-1));\n\n  // 统计透明像素(alpha<10)的 bbox + centroid = 圆孔\n  let tMinX=1e9,tMinY=1e9,tMaxX=-1,tMaxY=-1,tSx=0,tSy=0,tN=0;\n  // 统计白色高亮(R,G,B>200 且 alpha>100) bbox+centroid = 白边\n  let wMinX=1e9,wMinY=1e9,wMaxX=-1,wMaxY=-1,wSx=0,wSy=0,wN=0;\n  let alphaZero=0, alphaFull=0;\n  for (let y = 0; y < h; y++) {\n    for (let x = 0; x < w; x++) {\n      const i = y * w * bpp + x * bpp;\n      const a = bpp === 4 ? px[i+3] : (bpp === 2 ? px[i+1] : 255);\n      const r = px[i], g = bpp>=3 ? px[i+1] : px[i], b = bpp>=3 ? px[i+2] : px[i];\n      if (a < 10) { alphaZero++; if(x<tMinX)tMinX=x; if(x>tMaxX)tMaxX=x; if(y<tMinY)tMinY=y; if(y>tMaxY)tMaxY=y; tSx+=x; tSy+=y; tN++; }\n      if (a > 250) alphaFull++;\n      if (a > 100 && r>200 && g>200 && b>200) { wN++; wSx+=x; wSy+=y; if(x<wMinX)wMinX=x; if(x>wMaxX)wMaxX=x; if(y<wMinY)wMinY=y; if(y>wMaxY)wMaxY=y; }\n    }\n  }\n  console.log('  alpha=0 count=' + alphaZero + '  alpha=255 count=' + alphaFull);\n  if (tN > 0) console.log('  透明圆孔 bbox=[' + tMinX + ',' + tMaxX + ']x[' + tMinY + ',' + tMaxY + '] center=(' + ((tMinX+tMaxX)/2).toFixed(1) + ',' + ((tMinY+tMaxY)/2).toFixed(1) + ') centroid=(' + (tSx/tN).toFixed(1) + ',' + (tSy/tN).toFixed(1) + ')');\n  else console.log('  无透明像素!');\n  if (wN > 0) console.log('  白色高亮 bbox=[' + wMinX + ',' + wMaxX + ']x[' + wMinY + ',' + wMaxY + '] center=(' + ((wMinX+wMaxX)/2).toFixed(1) + ',' + ((wMinY+wMaxY)/2).toFixed(1) + ') centroid=(' + (wSx/wN).toFixed(1) + ',' + (wSy/wN).toFixed(1) + ')');\n  else console.log('  无白色高亮像素!');\n  console.log('  图片几何中心=(' + (w/2) + ',' + (h/2) + ')');\n}\n\nstats('assets/miasma_circle_1.png');\nstats('assets/miasma_circle_2.png');\n\"", "Bash=cd \"D:\\reasonixWrokspace\\gbf-rouge-helper\" && node -e \"\nconst fs = require('fs');\nconst zlib = require('zlib');\n\nfunction load(path) {\n  const buf = fs.readFileSync(path);\n  let off = 8, idat = Buffer.alloc(0), w, h, bd, ct;\n  let plte = null, trns = null;\n  while (off < buf.length) {\n    const len = buf.readUInt32BE(off);\n    const typ = buf.toString('ascii', off + 4, off + 8);\n    const data = buf.slice(off + 8, off + 8 + len);\n    if (typ === 'IHDR') { w = data.readUInt32BE(0); h = data.readUInt32BE(4); bd = data[8]; ct = data[9]; }\n    else if (typ === 'PLTE') plte = data;\n    else if (typ === 'tRNS') trns = data;\n    else if (typ === 'IDAT') idat = Buffer.concat([idat, data]);\n    off += 12 + len;\n  }\n  const raw = zlib.inflateSync(idat);\n  // 索引图：每像素1字节(假设bd=8)，加每行1字节filter\n  const stride = w; // 1 byte per pixel\n  const idx = Buffer.alloc(w * h);\n  for (let y = 0; y < h; y++) {\n    const f = raw[y * (stride + 1)];\n    const rs = y * (stride + 1) + 1;\n    for (let x = 0; x < stride; x++) {\n      const rb = raw[rs + x];\n      const left = x >= 1 ? idx[y * stride + x - 1] : 0;\n      const up = y > 0 ? idx[(y - 1) * stride + x] : 0;\n      const ul = (x >= 1 && y > 0) ? idx[(y - 1) * stride + x - 1] : 0;\n      let v;\n      if (f === 0) v = rb;\n      else if (f === 1) v = rb + left;\n      else if (f === 2) v = rb + up;\n      else if (f === 3) v = rb + ((left + up) >> 1);\n      else { const p = left + up - ul; const pa = Math.abs(p-left), pb = Math.abs(p-up), pc = Math.abs(p-ul); v = rb + (pa<=pb&&pa<=pc?left:pb<=pc?up:ul); }\n      idx[y * stride + x] = v & 0xff;\n    }\n  }\n  return { w, h, ct, idx, plte, trns };\n}\n\nfunction stats(path) {\n  const { w, h, ct, idx, plte, trns } = load(path);\n  const nPal = plte.length / 3;\n  console.log('=== ' + path + '  palette entries=' + nPal + '  tRNS bytes=' + (trns ? trns.length : 0) + ' ===');\n  const alphaOf = (i) => (trns && i < trns.length) ? trns[i] : 255;\n  const rgbOf = (i) => [plte[i*3], plte[i*3+1], plte[i*3+2]];\n\n  // 透明像素(alpha<10) bbox+centroid = 圆孔\n  let tMinX=1e9,tMinY=1e9,tMaxX=-1,tMaxY=-1,tSx=0,tSy=0,tN=0;\n  // 白色高亮(RGB>200 且 alpha>100) bbox+centroid = 白边\n  let wMinX=1e9,wMinY=1e9,wMaxX=-1,wMaxY=-1,wSx=0,wSy=0,wN=0;\n  let alphaZero=0;\n  for (let y = 0; y < h; y++) {\n    for (let x = 0; x < w; x++) {\n      const i = idx[y * w + x];\n      const a = alphaOf(i);\n      const [r, g, b] = rgbOf(i);\n      if (a < 10) { alphaZero++; if(x<tMinX)tMinX=x; if(x>tMaxX)tMaxX=x; if(y<tMinY)tMinY=y; if(y>tMaxY)tMaxY=y; tSx+=x; tSy+=y; tN++; }\n      if (a > 100 && r>200 && g>200 && b>200) { wN++; wSx+=x; wSy+=y; if(x<wMinX)wMinX=x; if(x>wMaxX)wMaxX=x; if(y<wMinY)wMinY=y; if(y>wMaxY)wMaxY=y; }\n    }\n  }\n  console.log('  alpha<10 count=' + alphaZero);\n  if (tN > 0) console.log('  透明圆孔 bbox=[' + tMinX + ',' + tMaxX + ']x[' + tMinY + ',' + tMaxY + '] bboxCenter=(' + ((tMinX+tMaxX)/2).toFixed(1) + ',' + ((tMinY+tMaxY)/2).toFixed(1) + ') centroid=(' + (tSx/tN).toFixed(1) + ',' + (tSy/tN).toFixed(1) + ')');\n  if (wN > 0) console.log('  白色高亮 bbox=[' + wMinX + ',' + wMaxX + ']x[' + wMinY + ',' + wMaxY + '] bboxCenter=(' + ((wMinX+wMaxX)/2).toFixed(1) + ',' + ((wMinY+wMaxY)/2).toFixed(1) + ') centroid=(' + (wSx/wN).toFixed(1) + ',' + (wSy/wN).toFixed(1) + ')');\n  console.log('  图片几何中心=(' + (w/2) + ',' + (h/2) + ')');\n  if (wN > 0) console.log('  白边相对几何中心偏移 dx=' + ((wSx/wN) - w/2).toFixed(1) + ' dy=' + ((wSy/wN) - h/2).toFixed(1));\n}\n\nstats('assets/miasma_circle_1.png');\nstats('assets/miasma_circle_2.png');\n\"", "Bash=cd \"D:\\reasonixWrokspace\\gbf-rouge-helper\" && node -e \"\nconst fs = require('fs');\nconst h = JSON.parse(fs.readFileSync('game.granbluefantasy.jp-2.har', 'utf8'));\nlet payload = null;\nfor (const e of h.log.entries) {\n  if (!e.request.url.includes('arcarum3/dungeon/content/index')) continue;\n  const t = e.response.content && e.response.content.text;\n  if (!t || t.length < 1000) continue;\n  const outer = JSON.parse(t);\n  if (outer.option && outer.option.dungeon && outer.option.dungeon.node_list) { payload = outer.option.dungeon; break; }\n}\nconst d = payload;\nconst a = d.miasma_info.after;\nconst cx = a.center_position_x, cy = a.center_position_y;\nconst nodes = d.node_list.map(n => ({ id:n.node_id, x:n.position_x, y:n.position_y, s:!!n.is_shrinking }));\nconst safe = nodes.filter(n => !n.s), shr = nodes.filter(n => n.s);\n\n// map_sample 同 map_id，取 center_node 的 position 作候选锚点\nconst ms = JSON.parse(fs.readFileSync('analysis/map_sample.json', 'utf8'));\nconst msMap = new Map(ms.node_list.map(n => [n.node_id, n]));\nconst cn = msMap.get(a.center_node_id);\nconsole.log('center_pos=(' + cx + ',' + cy + ') center_node#' + a.center_node_id + ' pos=' + (cn ? '('+cn.position_x+','+cn.position_y+')' : 'NA'));\nconst offNode = cn ? { ox: cn.position_x - cx, oy: cn.position_y - cy } : null;\nif (offNode) console.log('候选 offset(node-center)=(' + offNode.ox + ',' + offNode.oy + ') 模长=' + Math.hypot(offNode.ox, offNode.oy).toFixed(1));\n\n// 分类错误数：给定 (ax,ay,R)，错误 = safe 在圈外 + shrinking 在圈内\nfunction errors(ax, ay, R) {\n  let e = 0;\n  for (const n of safe) if (Math.hypot(n.x-ax, n.y-ay) > R) e++;\n  for (const n of shr) if (Math.hypot(n.x-ax, n.y-ay) <= R) e++;\n  return e;\n}\n\n// 网格搜索 offset ±300 step 6, R 80..1500 step 12\nlet best = { e: 1e9 };\nfor (let ox = -300; ox <= 300; ox += 6) {\n  for (let oy = -300; oy <= 300; oy += 6) {\n    const ax = cx + ox, ay = cy + oy;\n    // 对每个 offset，找最优 R：扫描 R\n    // 为加速，先收集所有距离\n    let be = 1e9, bR = 0;\n    for (let R = 80; R <= 1500; R += 12) {\n      const er = errors(ax, ay, R);\n      if (er < be) { be = er; bR = R; }\n    }\n    if (be < best.e) best = { e: be, ox, oy, R: bR };\n  }\n}\nconsole.log('');\nconsole.log('最佳拟合(错误数最小): offset=(' + best.ox + ',' + best.oy + ') R=' + best.R + ' 错误=' + best.e + '/' + nodes.length);\nconsole.log('  → 白圈圆心 = center + (' + best.ox + ',' + best.oy + ') = (' + (cx+best.ox) + ',' + (cy+best.oy) + ')');\n\n// 对照候选 offset(node-center) 下的最优 R\nif (offNode) {\n  let be = 1e9, bR = 0;\n  for (let R = 80; R <= 1500; R += 4) { const er = errors(cx+offNode.ox, cy+offNode.oy, R); if (er < be) { be = er; bR = R; } }\n  console.log('候选 offset(node) 下最优 R=' + bR + ' 错误=' + be);\n}\n// 对照无偏移\n{ let be=1e9,bR=0; for(let R=80;R<=1500;R+=4){const er=errors(cx,cy,R);if(er<be){be=er;bR=R;}} console.log('无偏移 下最优 R=' + bR + ' 错误=' + be); }\n\"", "Bash=cd \"D:\\reasonixWrokspace\\gbf-rouge-helper\" && node -e \"\nconst fs=require('fs');\nconst t=fs.readFileSync('analysis/map.js','utf8');\nconst i=t.indexOf('n.x=e.coordinate.x,n.y=e.coordinate.y,n.addEventListener');\nconsole.log('=== createNode 节点 container 构建上下文 (前700 后200) ===');\nconsole.log(t.slice(i-700, i+200));\n\"", "Bash=cd \"D:\\reasonixWrokspace\\gbf-rouge-helper\" && node -e \"\nconst fs = require('fs');\nconst code = fs.readFileSync('window/map-renderer.js', 'utf8');\nnew Function(code.replace(/import .*/g, '// import').replace(/export /g, ''));\nconsole.log('SYNTAX PASS');\n// 确认修复生效\nconst i1 = code.indexOf('MIASMA_CENTER_OFFSET');\nconst i2 = code.indexOf('const cx = a.center_position_x - MIASMA_CENTER_OFFSET.X');\nconsole.log('常量定义:', i1 >= 0);\nconsole.log('圆心偏移应用:', i2 >= 0);\n\""]

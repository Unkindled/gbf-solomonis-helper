<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GBF Solomonis Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="topbar">
      <div id="topbar-left">
        <div id="dungeon-point" class="hud-chip coin-chip" title="Sephira Coins">0</div>
        <div id="party-bar"></div>
        <div id="weapon-deck"></div>
      </div>
      <div id="topbar-mid">
        <div id="status-bar">Waiting for game data...</div>
        <div id="path-info">
          <span class="path-hint">Click a node to plan a route from your position.</span>
        </div>
        <div id="type-chips" role="group" aria-label="Node type filters"></div>
        <button id="btn-filter" class="btn-special" title="Special event filters" aria-haspopup="true"><span data-i18n="filter.specialEvent">Special Events</span></button>
        <button id="btn-clear-filters" class="btn-special" title="Clear all filters"><span data-i18n="filter.clearAll">Clear All</span></button>
        <div id="filter-dropdown" class="filter-dropdown hidden">
          <div id="filter-special"></div>
        </div>
      </div>
      <div id="topbar-right">
        <button id="btn-lang" class="btn-small" title="Switch language">中文</button>
        <button id="btn-topbar-side" class="btn-small" title="Move bar to bottom" aria-label="Move bar to bottom">⬇</button>
        <button id="btn-focus" class="hud-iconbtn compass" title="Navigation" aria-label="Navigation" aria-haspopup="true">
          <svg viewBox="0 0 24 24" class="compass-svg" aria-hidden="true">
            <circle cx="12" cy="12" r="9" class="compass-ring"/>
            <path d="M12 3 L13.6 10.4 L12 9 L10.4 10.4 Z" class="compass-needle-n"/>
            <path d="M12 21 L10.4 13.6 L12 15 L13.6 13.6 Z" class="compass-needle-s"/>
            <circle cx="12" cy="12" r="1.6" class="compass-hub"/>
          </svg>
        </button>
        <button id="btn-guidebook" class="hud-iconbtn tome" title="Guide Books" aria-label="Guide Books">
          <img src="../assets/book_thumb_1.png" alt="Guide Books">
          <span id="guidebook-badge" class="hud-btn-badge hud-badge-total hidden">0</span>
          <span id="guidebook-badge-fav" class="hud-btn-badge hud-badge-fav hidden">♥0</span>
          <span id="guidebook-badge-cursed" class="hud-btn-badge hud-badge-cursed hidden">☠0</span>
          <span id="guidebook-stale" class="hud-btn-stale hidden" title="Guide books may be out of date — open the in-game guidebook page to refresh">!</span>
        </button>
        <div id="nav-menu" class="nav-menu hidden"></div>
      </div>
    </div>
    <div id="map-container">
      <canvas id="map-canvas"></canvas>
      <div id="pick-overlay" class="pick-overlay hidden">
        <div class="pick-overlay-header">
          <span data-i18n="pick.title">Guide Book Choice</span>
          <button id="pick-overlay-close" class="btn-small">×</button>
        </div>
        <div id="pick-overlay-body"></div>
      </div>
      <div id="custom-path-overlay" class="custom-path-overlay hidden">
        <div class="custom-path-header">
          <span data-i18n="custom.title">Custom Path</span>
        </div>
        <div class="custom-path-body">
          <span data-i18n="custom.hint">Click up to 6 nodes on the map, then confirm.</span>
          <span id="custom-path-count" class="custom-path-count">0/6</span>
        </div>
        <div class="custom-path-actions">
          <button id="custom-path-confirm" class="btn-small" data-i18n="custom.confirm">Confirm</button>
          <button id="custom-path-cancel" class="btn-small" data-i18n="custom.cancel">Cancel</button>
        </div>
      </div>
      <div id="event-detail-overlay" class="event-detail-overlay hidden"></div>
      <div id="guidebook-popup" class="guidebook-popup hidden">
        <div class="guidebook-popup-header">
          <span id="guidebook-popup-title">My Guide Books</span>
          <span class="guidebook-header-actions">
            <button id="gb-owned-lang" class="btn-small" title="Toggle Chinese / original text">显示译文</button>
            <button id="gb-open-codex" class="btn-small gb-codex-btn" title="Open Guide Book Codex">Guidebook Codex</button>
            <button id="guidebook-popup-close" class="btn-small">×</button>
          </span>
        </div>
        <div id="guidebook-popup-body"></div>
      </div>
      <!-- Guide book codex: separate large "book" modal -->
      <div id="guidebook-codex" class="guidebook-codex hidden">
        <div class="guidebook-codex-header">
          <span class="guidebook-codex-title" data-i18n="gb.codex">Guidebook Codex</span>
          <button id="gb-codex-close" class="btn-small">×</button>
        </div>
        <div class="guidebook-codex-controls">
          <input id="gb-codex-search" type="text" data-i18n-placeholder="gb.search" class="gb-codex-search">
          <select id="gb-codex-rarity" class="gb-codex-select">
            <option value="" data-i18n="gb.rarity">Rarity: All</option>
            <option value="1">Normal</option>
            <option value="2">Rare</option>
            <option value="3">Unique</option>
            <option value="99">Cursed</option>
          </select>
          <select id="gb-codex-type" class="gb-codex-select">
            <option value="" data-i18n="gb.type">Type: All</option>
            <option value="na">Normal Attack</option>
            <option value="skill">Skill DMG</option>
            <option value="ca">Charge Attack</option>
            <option value="def">Defensive</option>
            <option value="summon">Summon</option>
            <option value="misc">Miscellaneous</option>
          </select>
          <select id="gb-codex-avail" class="gb-codex-select">
            <option value="" data-i18n="gb.avail">Availability: All</option>
            <option value="global">Global</option>
            <option value="event">Event</option>
            <option value="character">Character</option>
          </select>
          <select id="gb-codex-own" class="gb-codex-select">
            <option value="" data-i18n="gb.own">Ownership: All</option>
            <option value="owned" data-i18n="gb.ownOwned">Owned</option>
            <option value="missing" data-i18n="gb.ownMissing">Not owned</option>
          </select>
          <select id="gb-codex-fav" class="gb-codex-select">
            <option value="" data-i18n="gb.fav">Favorite: All</option>
            <option value="fav" data-i18n="gb.favOnly">Favorites</option>
          </select>
          <select id="gb-codex-lang" class="gb-codex-select" data-i18n-title="gb.lang">
            <option value="text">EN</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
          </select>
          <select id="gb-codex-map" class="gb-codex-select">
            <option value="" data-i18n="gb.idMap">ID Map: All</option>
            <option value="mapped" data-i18n="gb.idMapMapped">Mapped (✓)</option>
            <option value="unmapped" data-i18n="gb.idMapUnmapped">Unmapped (△)</option>
          </select>
          <span class="gb-data-actions">
            <button id="gb-export-data" class="btn-small" data-i18n="gb.export">⬇ Export</button>
            <button id="gb-import-data" class="btn-small" data-i18n="gb.import">⬆ Import</button>
            <input type="file" id="gb-import-file" accept=".json,application/json" class="hidden">
          </span>
        </div>
        <div id="guidebook-codex-body"></div>
      </div>
    </div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

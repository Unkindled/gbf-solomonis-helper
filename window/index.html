<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GBF Solomonis Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div id="map-container">
      <div id="hud-top">
        <div id="hud-left">
          <div id="dungeon-point" class="hud-chip coin-chip" title="Sephira Coins">0</div>
          <div id="party-bar"></div>
        </div>
        <div id="hud-right">
          <div id="nav-menu" class="nav-menu hidden"></div>
          <button id="btn-focus" class="hud-iconbtn compass" title="Navigation" aria-label="Navigation" aria-haspopup="true">
            <svg viewBox="0 0 24 24" class="compass-svg" aria-hidden="true">
              <circle cx="12" cy="12" r="9" class="compass-ring"/>
              <path d="M12 3 L13.6 10.4 L12 9 L10.4 10.4 Z" class="compass-needle-n"/>
              <path d="M12 21 L10.4 13.6 L12 15 L13.6 13.6 Z" class="compass-needle-s"/>
              <circle cx="12" cy="12" r="1.6" class="compass-hub"/>
            </svg>
          </button>
          <button id="btn-guidebook" class="hud-iconbtn tome" title="Guide Books" aria-label="Guide Books">
            <img src="../assets/book_thumb_1.png" alt="Guide Books">
            <span id="guidebook-badge" class="hud-btn-badge hidden">0</span>
            <span id="guidebook-stale" class="hud-btn-stale hidden" title="Guide books may be out of date — open the in-game guidebook page to refresh">!</span>
          </button>
        </div>
      </div>
      <canvas id="map-canvas"></canvas>
      <div id="floating-path-info" class="hidden"></div>
      <div id="guidebook-popup" class="guidebook-popup hidden">
        <div class="guidebook-popup-header">
          <div class="guidebook-tabs">
            <button id="gb-tab-owned" class="guidebook-tab active">My Guide Books</button>
            <button id="gb-tab-codex" class="guidebook-tab">Codex</button>
          </div>
          <button id="guidebook-popup-close" class="btn-small">×</button>
        </div>
        <div id="guidebook-codex-controls" class="guidebook-codex-controls hidden">
          <input id="gb-codex-search" type="text" placeholder="Search guide books..." class="gb-codex-search">
          <select id="gb-codex-rarity" class="gb-codex-select">
            <option value="">Rarity: All</option>
            <option value="1">Normal</option>
            <option value="2">Rare</option>
            <option value="3">Unique</option>
            <option value="99">Cursed</option>
          </select>
          <select id="gb-codex-type" class="gb-codex-select">
            <option value="">Type: All</option>
            <option value="na">Normal Attack</option>
            <option value="skill">Skill DMG</option>
            <option value="ca">Charge Attack</option>
            <option value="def">Defensive</option>
            <option value="summon">Summon</option>
            <option value="misc">Miscellaneous</option>
          </select>
          <select id="gb-codex-avail" class="gb-codex-select">
            <option value="">Availability: All</option>
            <option value="global">Global</option>
            <option value="event">Event</option>
            <option value="character">Character</option>
          </select>
          <select id="gb-codex-own" class="gb-codex-select">
            <option value="">Ownership: All</option>
            <option value="owned">Owned</option>
            <option value="missing">Not owned</option>
          </select>
          <select id="gb-codex-fav" class="gb-codex-select">
            <option value="">Favorite: All</option>
            <option value="fav">Favorites</option>
          </select>
        </div>
        <div id="guidebook-popup-body"></div>
      </div>
    </div>
    <div id="sidebar">
      <div class="sidebar-toolbar">
        <button id="btn-sidebar-side" class="btn-small" title="Move panel to the other side">⇄</button>
        <button id="btn-sidebar-collapse" class="btn-small" title="Collapse filter panel">▾</button>
      </div>
      <div id="status-bar">Waiting for game data...</div>
      <div id="path-info">
        <span class="path-hint">Click a node to plan a route from your position.</span>
      </div>
      <div class="sidebar-actions">
        <button id="btn-lang" class="btn-export" title="Switch language">中文</button>
      </div>
      <div id="filter-panel"></div>
    </div>
    <button id="btn-export-miasma" class="btn-export-hidden" title="Export Miasma Log"><span class="bex-emoji">📋</span><span class="bex-label">Export Miasma Log</span></button>
  </div>
  <script src="../shared/i18n.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #26a69a;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #26a69a;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background: #2bbbad;
    }
    .hint {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <h3>GBF Map Helper</h3>
  <button id="btn-open">Open Map Window</button>
  <p class="hint">Make sure the game is open in a tab on game.granbluefantasy.jp</p>
  <script src="popup.js"></script>
</body>
</html>
